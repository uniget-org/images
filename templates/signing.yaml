.sign:
  image: registry.gitlab.com/uniget-org/cli:noble
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
  - |
    uniget install cosign
    uniget install jq
  script:
  - |
    if [ "${PUSH}" != "true" ]; then
        echo "### Skipping (PUSH is not true)"
        exit 0
    fi
  - |
    echo "### Signing image ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}"
  - |
    cosign sign --yes \
        --registry-username "${CI_REGISTRY_USER}" \
        --registry-password "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}"

.attest-provenance:
  image: registry.gitlab.com/uniget-org/cli:noble
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
  - |
    uniget install cosign
    uniget install jq
  script:
  - |
    if [ "${PUSH}" != "true" ]; then
        echo "### Skipping (PUSH is not true)"
        exit 0
    fi
  - |
    echo "### Creating SLSA provenance predicate for ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}"
  - |
    cat >provenance-predicate-${IMAGE_NAME}-${TAG}.json <<EOF
    {
      "buildDefinition": {
        "buildType": "https://gitlab.com/${CI_PROJECT_PATH}/-/blob/${CI_COMMIT_REF_NAME}/.gitlab-ci.yml",
        "externalParameters": {
          "pipelineSource": "${CI_PIPELINE_SOURCE}",
          "commitSha": "${CI_COMMIT_SHA}",
          "commitRef": "${CI_COMMIT_REF_NAME}",
          "commitTag": "${CI_COMMIT_TAG}"
        },
        "internalParameters": {
          "imageName": "${IMAGE_NAME}",
          "tag": "${TAG}",
          "jobName": "${CI_JOB_NAME}",
          "runnerDescription": "${RUNNER_DESCRIPTION}",
          "architectures": ["amd64", "arm64"]
        },
        "resolvedDependencies": [
          {
            "uri": "git+https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}",
            "digest": {
              "gitCommit": "${CI_COMMIT_SHA}"
            },
            "name": "source"
          }
        ]
      },
      "runDetails": {
        "builder": {
          "id": "${CI_JOB_URL}"
        },
        "metadata": {
          "invocationId": "${CI_JOB_URL}",
          "startedOn": "$( date --utc +%Y-%m-%dT%H:%M:%SZ )"
        }
      }
    }
    EOF
    jq . provenance-predicate-${IMAGE_NAME}-${TAG}.json
  - |
    echo "### Attesting image ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}"
  - |
    cosign attest --yes \
        --predicate "provenance-predicate-${IMAGE_NAME}-${TAG}.json" \
        --type slsaprovenance1 \
        --registry-username "${CI_REGISTRY_USER}" \
        --registry-password "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}"
  artifacts:
    paths:
    - provenance-predicate-${IMAGE_NAME}-${TAG}.json

.attest-sbom:
  image: registry.gitlab.com/uniget-org/cli:noble
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
  - |
    uniget install cosign
    uniget install trivy
  script:
  - |
    if [ "${PUSH}" != "true" ]; then
        echo "### Skipping (PUSH is not true)"
        exit 0
    fi
  - |
    echo "### Generating SBOM for ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}-${ARCH}"
  - |
    export TRIVY_USERNAME="${CI_REGISTRY_USER}"
    export TRIVY_PASSWORD="${CI_REGISTRY_PASSWORD}"
    trivy image \
        --format cyclonedx \
        --output "sbom-${IMAGE_NAME}-${TAG}-${ARCH}.json" \
        --skip-db-update \
        --skip-java-db-update \
        "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}-${ARCH}"
  - |
    echo "### Attesting SBOM for ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}-${ARCH}"
  - |
    cosign attest --yes \
        --predicate "sbom-${IMAGE_NAME}-${TAG}-${ARCH}.json" \
        --type cyclonedx \
        --registry-username "${CI_REGISTRY_USER}" \
        --registry-password "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${TAG}-${ARCH}"
  artifacts:
    paths:
    - sbom-${IMAGE_NAME}-${TAG}-${ARCH}.json

.scan-vulnerabilities:
  image: registry.gitlab.com/uniget-org/cli:noble
  before_script:
  - |
    uniget install trivy
  script:
  - |
    if [ "${PUSH}" != "true" ]; then
        echo "### Skipping (PUSH is not true)"
        exit 0
    fi
  - |
    echo "### Scanning SBOM sbom-${IMAGE_NAME}-${TAG}-${ARCH}.json for vulnerabilities"
  - |
    trivy sbom \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format table \
        "sbom-${IMAGE_NAME}-${TAG}-${ARCH}.json"
